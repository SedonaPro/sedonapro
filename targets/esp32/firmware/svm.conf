# svm.conf for ESP32-S3 (LittleFS /sedona/svm.conf), see runtime SVM_CONFIG_RU.md.
# On ESP32 the clock is always esp_timer; rt.* and crash.handler do nothing
# (core/priority come from Kconfig, the ESP-IDF panic handler prints backtraces).

# stage files (kits.scode.stage / app.sab.stage from SOX): check, keep last-known-good
stage.validate = 1
stage.rollback = 1
stage.trial.seconds = 60
stage.trial.attempts = 3

# app.sab via .tmp + fsync + rename (LittleFS rename is atomic)
save.atomic = 1
save.keep = 3

# safe start with app.sab.bak after 3 failed starts in a row
safeboot.after = 3
safeboot.healthy.seconds = 30

# watchdog: auto = on when the firmware arms the task watchdog (Kconfig)
watchdog = auto

# statistics in the log every 5 minutes
stats.interval = 300

# stack of the Sedona VM in cells (4 bytes each on ESP32)
stack.cells = 2048

# fixes for the Modbus Master (field-wise result copy, safe register removal)
# and leak fixes in Modbus Slave / expression parser (modules modbus, expression)
modbus.safe = 1
mem.fixes = 1
