name: Feature request
description: Propose a focused improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour and alternatives
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and affected platforms
